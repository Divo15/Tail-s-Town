<button class="support-launcher" type="button" aria-controls="support-panel" aria-expanded="false" aria-label="Open Tail's Town support" hidden>
  <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7 17v-2a9 9 0 0 1 18 0v2M7 17H5.8A2.8 2.8 0 0 0 3 19.8v1.4A2.8 2.8 0 0 0 5.8 24H8V16.5M25 17h1.2a2.8 2.8 0 0 1 2.8 2.8v1.4a2.8 2.8 0 0 1-2.8 2.8H25v-7.5M25 24c0 2.2-1.8 4-4 4h-2" /></svg>
</button>
<section class="support-panel" id="support-panel" role="dialog" aria-modal="false" aria-labelledby="support-title" hidden>
  <div class="support-panel-header">
    <div class="support-panel-heading">
      <span class="support-status"><i aria-hidden="true"></i> Tail's Town support</span>
      <h2 id="support-title">How can we help?</h2>
    </div>
    <button class="support-close" type="button" aria-label="Close support panel">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15" /></svg>
    </button>
  </div>
  <div class="support-panel-body">
    <p class="support-intro">Tell us who you are and our pet-care team will get back to you.</p>
    <form class="support-form" data-support-form action="#" method="post">
      <label for="support-name">Your name</label>
      <input id="support-name" name="name" type="text" autocomplete="name" placeholder="Alex Johnson" maxlength="120" required />
      <label for="support-email">Email address</label>
      <input id="support-email" name="email" type="email" autocomplete="email" placeholder="name@example.com" required />
      <button type="submit">Start conversation <span aria-hidden="true">&rarr;</span></button>
      <p class="support-form-status" data-support-status role="status" aria-live="polite"></p>
    </form>
    <p class="support-privacy">Your details stay private and are only used to respond to your request.</p>
  </div>
</section>
