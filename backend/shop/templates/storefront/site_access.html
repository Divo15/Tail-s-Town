{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Private Preview | Tail's Town</title>
    <link rel="icon" href="{% static 'brand/favicon.ico' %}">
    <link rel="stylesheet" href="{% static 'site/site-access.css' %}">
    <script src="{% static 'site/site-access.js' %}" defer></script>
  </head>
  <body>
    <main class="access-shell">
      <section class="access-panel" aria-labelledby="access-title">
        <a class="access-brand" href="/" aria-label="Tail's Town home">
          <img
            src="{% static 'product-pages/assets/tails-town-header-logo-full.webp' %}"
            width="1408"
            height="1429"
            alt="Tail's Town"
          >
        </a>

        <div class="access-content">
          <div class="access-copy">
            <h1 id="access-title">Private preview</h1>
            <p>Enter the password to continue.</p>
          </div>

          <form class="access-form" method="post" action="{% url 'site_access' %}">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            <label for="site-password">Password</label>
            <div class="password-control">
              <input
                id="site-password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
                autofocus
                {% if error %}aria-describedby="access-error"{% endif %}
              >
              <button
                class="password-toggle"
                type="button"
                data-password-toggle
                aria-label="Show password"
                aria-pressed="false"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" />
                  <circle cx="12" cy="12" r="2.75" />
                </svg>
              </button>
            </div>
            <button class="access-submit" type="submit">
              Continue
              <span aria-hidden="true">&rarr;</span>
            </button>
            {% if error %}
              <p class="access-error" id="access-error" role="alert">{{ error }}</p>
            {% endif %}
          </form>
        </div>
      </section>

      <picture class="access-visual">
        <source media="(max-width: 640px)" srcset="{% static 'landing/all-products-hall-mobile.webp' %}">
        <source media="(max-width: 1024px)" srcset="{% static 'landing/all-products-hall-tablet.webp' %}">
        <img
          src="{% static 'landing/all-products-hall-desktop.webp' %}"
          alt="Tail's Town smart pet-care products in a calm Canadian home"
          width="2800"
          height="1000"
        >
      </picture>
    </main>
  </body>
</html>
