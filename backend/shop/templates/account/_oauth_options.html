{% load socialaccount %}
<div class="oauth-options" aria-label="Social sign-in options">
  {% if oauth_provider_status.apple %}
  <form class="oauth-form" method="post" action="{% provider_login_url 'apple' process='login' %}">
    {% csrf_token %}
    <button class="oauth-button" type="submit" data-oauth-provider="apple" aria-label="Continue with Apple" title="Continue with Apple">

    </button>
  </form>
  {% else %}
  <button class="oauth-button is-disabled" type="button" data-oauth-provider="apple" aria-label="Continue with Apple" title="Apple OAuth is not configured yet" disabled>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M17.05 12.54c-.03-3.14 2.56-4.67 2.68-4.74-1.47-2.15-3.76-2.44-4.57-2.47-1.92-.2-3.78 1.15-4.76 1.15-1 0-2.51-1.13-4.14-1.1-2.1.03-4.07 1.25-5.15 3.14-2.21 3.83-.56 9.46 1.56 12.56 1.06 1.52 2.3 3.21 3.93 3.15 1.59-.07 2.18-1.01 4.1-1.01 1.9 0 2.46 1.01 4.12.97 1.71-.03 2.79-1.52 3.81-3.05 1.22-1.74 1.71-3.46 1.73-3.55-.04-.01-3.28-1.25-3.31-5.05ZM13.9 3.29A5.39 5.39 0 0 0 15.13-.58a5.5 5.5 0 0 0-3.57 1.84 5.16 5.16 0 0 0-1.27 3.73c1.35.1 2.73-.68 3.61-1.7Z"/></svg>
  </button>
  {% endif %}

  {% if oauth_provider_status.google %}
  <form class="oauth-form" method="post" action="{% provider_login_url 'google' process='login' %}">
    {% csrf_token %}
    <button class="oauth-button" type="submit" data-oauth-provider="google" aria-label="Continue with Google" title="Continue with Google">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.6 12.23c0-.71-.06-1.4-.18-2.07H12v3.92h5.38a4.6 4.6 0 0 1-2 3.02v2.54h3.24c1.9-1.75 2.98-4.33 2.98-7.41Z"/><path fill="#34A853" d="M12 22c2.7 0 4.98-.9 6.63-2.36l-3.24-2.54c-.9.6-2.05.96-3.39.96-2.61 0-4.82-1.76-5.61-4.13H3.04v2.62A10 10 0 0 0 12 22Z"/><path fill="#FBBC05" d="M6.39 13.93A6.01 6.01 0 0 1 6.07 12c0-.67.11-1.32.32-1.93V7.45H3.04A10 10 0 0 0 2 12c0 1.61.38 3.14 1.04 4.55l3.35-2.62Z"/><path fill="#EA4335" d="M12 5.94c1.47 0 2.79.51 3.83 1.5l2.87-2.88A9.62 9.62 0 0 0 12 2a10 10 0 0 0-8.96 5.45l3.35 2.62C7.18 7.7 9.39 5.94 12 5.94Z"/></svg>
    </button>
  </form>

  <button class="oauth-button is-disabled" type="button" data-oauth-provider="google" aria-label="Continue with Google" title="Google OAuth is not configured yet" disabled>

  </button>
  {% endif %}

  {% if oauth_provider_status.facebook %}
  <form class="oauth-form" method="post" action="{% provider_login_url 'facebook' process='login' %}">
    {% csrf_token %}
    <button class="oauth-button" type="submit" data-oauth-provider="facebook" aria-label="Continue with Facebook" title="Continue with Facebook">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#1877F2" d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.05V9.41c0-3.03 1.79-4.7 4.53-4.7 1.31 0 2.69.24 2.69.24v2.97h-1.52c-1.49 0-1.96.93-1.96 1.89v2.26h3.33l-.53 3.49h-2.8V24C19.61 23.1 24 18.1 24 12.07Z"/></svg>

  </form>
  {% else %}
  <button class="oauth-button is-disabled" type="button" data-oauth-provider="facebook" aria-label="Continue with Facebook" title="Facebook OAuth is not configured yet" disabled>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#1877F2" d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.05V9.41c0-3.03 1.79-4.7 4.53-4.7 1.31 0 2.69.24 2.69.24v2.97h-1.52c-1.49 0-1.96.93-1.96 1.89v2.26h3.33l-.53 3.49h-2.8V24C19.61 23.1 24 18.1 24 12.07Z"/></svg>
  </button>

<div class="oauth-divider"><span>or</span></div>
