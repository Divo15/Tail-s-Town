<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tail's Town Avatar Preview</title>
    <style>
      :root {
        --ink: #17211f;
        --teal: #0f766e;
        --mint: #e7f4ef;
        --ball: #ffb45c;
        --maple: #b83a3f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        color: var(--ink);
        background:
          radial-gradient(circle at 18px 18px, rgba(15, 118, 110, 0.08) 0 5px, transparent 6px),
          linear-gradient(180deg, #fbfaf5, #eef7f8);
        background-size: 74px 74px, auto;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }

      .preview-stage {
        position: relative;
        overflow: hidden;
        width: min(1040px, 94vw);
        aspect-ratio: 16 / 7;
        border: 1px solid rgba(23, 33, 31, 0.14);
        border-radius: 12px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.82), rgba(255, 255, 255, 0.54) 58%, var(--mint) 59%),
          radial-gradient(circle at 85% 18%, rgba(255, 180, 92, 0.18), transparent 24%);
        box-shadow: 0 28px 80px rgba(21, 43, 40, 0.16);
      }

      .preview-stage::before {
        content: "";
        position: absolute;
        left: -10%;
        right: -10%;
        bottom: 17%;
        height: 2px;
        background: linear-gradient(90deg, transparent, rgba(15, 118, 110, 0.28), transparent);
      }

      .avatar-runner {
        position: absolute;
        left: -220px;
        bottom: 18%;
        width: clamp(130px, 17vw, 210px);
        animation: runAcross 5.6s linear infinite;
        will-change: transform;
      }

      .avatar-runner img {
        display: block;
        width: 100%;
        transform-origin: 50% 92%;
        animation: kittenBounce 420ms ease-in-out infinite;
        filter: drop-shadow(0 18px 20px rgba(23, 33, 31, 0.18));
      }

      .play-ball {
        position: absolute;
        left: -80px;
        bottom: 20%;
        width: clamp(34px, 4vw, 54px);
        aspect-ratio: 1;
        border: 4px solid var(--maple);
        border-radius: 50%;
        background:
          radial-gradient(circle at 32% 28%, rgba(255, 255, 255, 0.68), transparent 22%),
          var(--ball);
        animation: ballRun 5.6s linear infinite;
        box-shadow: 0 14px 18px rgba(23, 33, 31, 0.16);
      }

      .play-ball::before {
        content: "";
        position: absolute;
        inset: 9px;
        border-top: 3px solid var(--maple);
        border-radius: 50%;
        transform: rotate(32deg);
      }

      .shadow {
        position: absolute;
        left: -220px;
        bottom: 15%;
        width: clamp(120px, 15vw, 190px);
        height: 22px;
        border-radius: 999px;
        background: rgba(23, 33, 31, 0.12);
        filter: blur(2px);
        animation: shadowRun 5.6s linear infinite;
      }

      @keyframes runAcross {
        from {
          transform: translate3d(0, 0, 0);
        }
        to {
          transform: translate3d(calc(100vw + 420px), 0, 0);
        }
      }

      @keyframes shadowRun {
        from {
          transform: translate3d(0, 0, 0) scaleX(0.9);
        }
        50% {
          transform: translate3d(calc(50vw + 210px), 0, 0) scaleX(1.08);
        }
        to {
          transform: translate3d(calc(100vw + 420px), 0, 0) scaleX(0.9);
        }
      }

      @keyframes ballRun {
        from {
          transform: translate3d(0, 0, 0) rotate(0deg);
        }
        35% {
          transform: translate3d(calc(35vw + 170px), -16px, 0) rotate(420deg);
        }
        70% {
          transform: translate3d(calc(70vw + 280px), 8px, 0) rotate(840deg);
        }
        to {
          transform: translate3d(calc(100vw + 520px), 0, 0) rotate(1240deg);
        }
      }

      @keyframes kittenBounce {
        0%,
        100% {
          transform: translateY(0) rotate(-1.5deg) scaleX(1.02) scaleY(0.98);
        }
        50% {
          transform: translateY(-16px) rotate(2deg) scaleX(0.98) scaleY(1.04);
        }
      }
    </style>
  </head>
  <body>
    <div class="preview-stage" aria-label="Preview of kitten avatar running after a ball">
      <span class="shadow" aria-hidden="true"></span>
      <span class="avatar-runner">
        <img src="./assets/kitten-avatar.png" alt="Kitten avatar running" />
      </span>
      <span class="play-ball" aria-hidden="true"></span>
    </div>
  </body>
</html>
