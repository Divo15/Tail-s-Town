<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 520" role="img" aria-labelledby="title desc">
  <title id="title">Tail's Town Photo Tail Logo</title>
  <desc id="desc">Tail's Town logo with a dog photo on the left, cat photo on the right, and their tails forming the underline.</desc>
  <defs>
    <clipPath id="dogPhotoClip">
      <path d="M78 76c40-58 132-75 199-30 67 44 89 132 48 205-41 74-132 106-211 72C36 290 4 199 32 123c9-22 23-37 46-47z"/>
    </clipPath>
    <clipPath id="catPhotoClip">
      <path d="M118 43c-43 8-78 39-95 81-28 70 5 155 75 190 76 38 174 7 216-68 40-72 20-163-45-207-44-30-98-31-151 4z"/>
    </clipPath>
    <style>
      .ink {
        fill: #17211f;
      }

      .tealStroke {
        fill: none;
        stroke: #0b3d39;
        stroke-width: 11;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .tailStroke {
        fill: none;
        stroke: #b83a3f;
        stroke-width: 13;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .goldStroke {
        fill: none;
        stroke: #c78f4a;
        stroke-width: 8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .word {
        fill: #17211f;
        font-family: "Optima", "Avenir Next", "Montserrat", "Trebuchet MS", Arial, sans-serif;
        font-size: 122px;
        font-weight: 800;
        letter-spacing: -2.5px;
      }

      .subtle {
        opacity: 0.18;
      }
    </style>
  </defs>

  <g transform="translate(58 82)">
    <image href="hero-dog-water-summer.png" x="-86" y="-26" width="480" height="360" preserveAspectRatio="xMidYMid slice" clip-path="url(#dogPhotoClip)"/>
    <path class="tealStroke" d="M78 76c40-58 132-75 199-30 67 44 89 132 48 205-41 74-132 106-211 72C36 290 4 199 32 123c9-22 23-37 46-47z"/>
    <path class="goldStroke" d="M236 296c50 4 89 27 116 71"/>
  </g>

  <g transform="translate(405 112)">
    <text x="0" y="95" class="word">Tail's</text>
    <text x="430" y="95" class="word">Town</text>
    <path class="goldStroke subtle" d="M18 130h660"/>
  </g>

  <g transform="translate(1178 82)">
    <image href="hero-cat-litter-winter.png" x="-112" y="-34" width="500" height="360" preserveAspectRatio="xMidYMid slice" clip-path="url(#catPhotoClip)"/>
    <path class="tealStroke" d="M118 43c-43 8-78 39-95 81-28 70 5 155 75 190 76 38 174 7 216-68 40-72 20-163-45-207-44-30-98-31-151 4z"/>
    <path class="goldStroke" d="M84 300c-48 10-86 35-114 76"/>
  </g>

  <path class="tailStroke" d="M285 381c90 62 210 85 366 75 156-9 262-1 358 30"/>
  <path class="tailStroke" d="M1218 381c-95 68-216 91-365 74-88-10-169-3-244 22"/>
  <path class="tailStroke" d="M731 459c25 34 78 41 127 17"/>
</svg>
