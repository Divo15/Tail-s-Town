    <path d="M148 22c78 0 134 54 134 128 0 78-61 132-137 132C69 282 10 230 10 153 10 76 70 22 148 22z" fill="none" stroke="#0b3d39" stroke-width="11"/>
    <path d="M81 154c28-34 101-34 129 0" class="goldLine"/>
    <path d="M103 169c20 28 65 28 85 0" class="line"/>
    <path d="M201 104c51 1 72 53 38 85-30 29-82 8-78-32" class="redLine"/>
    <text x="0" y="370" class="word ink">Tail's Town</text>
  </g>

  <g transform="translate(90 735)">
    <text x="0" y="0" class="small deep">05 PRODUCT ETCH</text>
    <path d="M4 100h230c-16 55-55 83-115 83S20 155 4 100z" class="deep"/>
    <path d="M27 100c18-72 172-72 190 0" class="line"/>
    <path d="M121 100V34" class="goldLine"/>
    <path d="M104 34h34" class="goldLine"/>
    <path d="M214 62c62-10 82 54 33 78-33 16-69-1-75-33" class="redLine"/>
